---
# tasks file for apache
- name: Ensure required packages are installed
  ansible.builtin.dnf:
    name:
      - httpd
      - firewalld
    state: present

- name: Ensure httpd and firewalld is started and enabled
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - httpd
    - firewalld

- name: Allow http through the firewall
  ansible.posix.firewalld:
    service: http
    state: enabled
    immediate: true
    permanent: true

- name: Ensure the default index.html file is present
  ansible.builtin.template:
    src: index.html.j2 
    dest: /var/www/html/index.html
    mode: '0644'
