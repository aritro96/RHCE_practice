---
- name: Generate the hardware report
  hosts: all
  become: true
  gather_facts: true
  tasks:

    - name: Ensure the hwreport.txt is present in the correct path
      ansible.builtin.get_url:
        url: http://controlnode.example.com/hwreport.txt
        dest: /root/hwreport.txt

    - name: Generate the hardware report
      ansible.builtin.replace:
        path: /root/hwreport.txt
        regexp: "{{ item.key }}"
        replace: "{{ item.value }}"
      loop:
        - key: "Inventory Hostname"
          value: "{{ ansible_facts['fqdn'] }}"
        - key: "Total Memory in MB"
          value: "{{ ansible_facts['memtotal_mb'] }}"
        - key: "BIOS Version"
          value: "{{ ansible_facts['bios_version'] }}"
        - key: "Disk Size of sda"
          value: "{{ ansible_facts['devices']['sda']['size'] | default('NONE') }}"
        - key: "Disk Size of sdb"
          value: "{{ ansible_facts['devices']['sdb']['size'] | default('NONE') }}"

