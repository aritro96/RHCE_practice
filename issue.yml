---
- name: Modify the issue.yml file
  hosts: all
  become: true
  tasks:
    - name: Change for the hosts dev
      ansible.builtin.copy:
        content: "Development"
        dest: /etc/issue
      when: inventory_hostname in groups['dev']

    - name: Change for the hosts test
      ansible.builtin.copy:
        content: "Test"
        dest: /etc/issue
      when: inventory_hostname in groups['test']

    - name: Change for the hosts prod
      ansible.builtin.copy:
        content: "Production"
        dest: /etc/issue
      when: inventory_hostname in groups['prod']
